services:
  mysql:
    image: mysql:8.4
    container_name: bitss-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
    - 3307:3306
    volumes:
    - mysql_data:/var/lib/mysql
    - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  apigateway:
    build:
      context: ./ApiGateway
    container_name: bitss-apigateway
    ports:
    - 8080:8080
    restart: unless-stopped
    environment:
      USUARIO_SERVICE_URL: http://usuario:8081
      CATALOGO_SERVICE_URL: http://catalogo:8082
      CARRO_SERVICE_URL: http://carro:8083
      GESTION_SERVICE_URL: http://gestion:8084
      PAGOS_SERVICE_URL: http://pagos:8085
      COLECCION_SERVICE_URL: http://coleccion:8086
      NOTIFICACIONES_SERVICE_URL: http://notificaciones:8087
      PASARELA_SERVICE_URL: http://pasarela:8090
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:-BITSS-Cambiar-Esta-Clave-Secreta-Para-Produccion-2026}
    depends_on:
      usuario:
        condition: service_started
      catalogo:
        condition: service_started
      carro:
        condition: service_started
      gestion:
        condition: service_started
      pagos:
        condition: service_started
      coleccion:
        condition: service_started
      notificaciones:
        condition: service_started
  usuario:
    build:
      context: ./Usuario
    container_name: bitss-usuario
    ports:
    - 8081:8081
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/usuario_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
      USUARIO_SERVICE_URL: http://usuario:8081
      CATALOGO_SERVICE_URL: http://catalogo:8082
      CARRO_SERVICE_URL: http://carro:8083
      GESTION_SERVICE_URL: http://gestion:8084
      PAGOS_SERVICE_URL: http://pagos:8085
      COLECCION_SERVICE_URL: http://coleccion:8086
      NOTIFICACIONES_SERVICE_URL: http://notificaciones:8087
      PASARELA_SERVICE_URL: http://pasarela:8090
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:-BITSS-Cambiar-Esta-Clave-Secreta-Para-Produccion-2026}
  catalogo:
    build:
      context: ./Catalogo
    container_name: bitss-catalogo
    ports:
    - 8082:8082
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalogo_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
      USUARIO_SERVICE_URL: http://usuario:8081
      CATALOGO_SERVICE_URL: http://catalogo:8082
      CARRO_SERVICE_URL: http://carro:8083
      GESTION_SERVICE_URL: http://gestion:8084
      PAGOS_SERVICE_URL: http://pagos:8085
      COLECCION_SERVICE_URL: http://coleccion:8086
      NOTIFICACIONES_SERVICE_URL: http://notificaciones:8087
      PASARELA_SERVICE_URL: http://pasarela:8090
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:-BITSS-Cambiar-Esta-Clave-Secreta-Para-Produccion-2026}
  carro:
