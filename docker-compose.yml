services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  usuario:
    build: ./Usuario
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/usuario_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  catalogo:
    build: ./Catalogo
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalogo_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  carro:
    build: ./Carro
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carro_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
      CATALOGO_SERVICE_URL: http://catalogo:8082
    depends_on:
      mysql:
        condition: service_healthy
      usuario:
        condition: service_started
      catalogo:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  gestion:
    build: ./Gestion
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gestion_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
      CARRO_SERVICE_URL: http://carro:8083
      PAGOS_SERVICE_URL: http://pagos:8085
      COLECCION_SERVICE_URL: http://coleccion:8086
    depends_on:
      mysql:
        condition: service_healthy
      usuario:
        condition: service_started
      carro:
        condition: service_started
      pagos:
        condition: service_started
      coleccion:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  pagos:
    build: ./Pagos
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pagos_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      PASARELA_SERVICE_URL: ${PASARELA_SERVICE_URL:-http://host.docker.internal:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  coleccion:
    build: ./Coleccion
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coleccion_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
    depends_on:
      mysql:
        condition: service_healthy
      usuario:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  notificaciones:
    build: ./Notificaciones
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notificaciones_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
      GESTION_SERVICE_URL: http://gestion:8084
      CATALOGO_SERVICE_URL: http://catalogo:8082
    depends_on:
      mysql:
        condition: service_healthy
      usuario:
        condition: service_started
      gestion:
        condition: service_started
      catalogo:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  apigateway:
    build: ./ApiGateway
    ports:
      - "8080:8080"
    environment:
      USUARIO_SERVICE_URL: http://usuario:8081
      CATALOGO_SERVICE_URL: http://catalogo:8082
      CARRO_SERVICE_URL: http://carro:8083
      GESTION_SERVICE_URL: http://gestion:8084
      PAGOS_SERVICE_URL: http://pagos:8085
      COLECCION_SERVICE_URL: http://coleccion:8086
      NOTIFICACIONES_SERVICE_URL: http://notificaciones:8087
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
    depends_on:
      - usuario
      - catalogo
      - carro
      - gestion
      - pagos
      - coleccion
      - notificaciones
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

volumes:
  mysql_data: