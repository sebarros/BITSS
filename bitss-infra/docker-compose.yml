services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - bitss-net
    restart: unless-stopped

  usuario:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/bitss-usuario:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/usuario_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitss-net
    restart: unless-stopped

  catalogo:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/bitss-catalogo:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalogo_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitss-net
    restart: unless-stopped

  carro:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/bitss-carro:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carro_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
      CATALOGO_SERVICE_URL: http://catalogo:8082
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitss-net
    restart: unless-stopped

  gestion:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/bitss-gestion:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gestion_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
      CARRO_SERVICE_URL: http://carro:8083
      PAGOS_SERVICE_URL: http://pagos:8085
      COLECCION_SERVICE_URL: http://coleccion:8086
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitss-net
    restart: unless-stopped

  pagos:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/bitss-pagos:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pagos_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitss-net
    restart: unless-stopped

  coleccion:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/bitss-coleccion:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coleccion_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitss-net
    restart: unless-stopped

  notificaciones:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/bitss-notificaciones:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notificaciones_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BITSS_JWT_SECRET: ${BITSS_JWT_SECRET:?Define BITSS_JWT_SECRET en .env}
      USUARIO_SERVICE_URL: http://usuario:8081
      GESTION_SERVICE_URL: http://gestion:8084
      CATALOGO_SERVICE_URL: http://catalogo:8082
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitss-net
    restart: unless-stopped

networks:
  bitss-net:
    name: bitss-net

volumes:
  mysql_data:
