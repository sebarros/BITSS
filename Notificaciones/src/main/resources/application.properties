spring.application.name=Notificaciones

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/notificaciones_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8087
bitss.jwt.secret=${BITSS_JWT_SECRET:BITSS-Cambiar-Esta-Clave-Secreta-Para-Produccion-2026}
